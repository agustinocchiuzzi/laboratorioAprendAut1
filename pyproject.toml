[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aa-futbol-uruguayo"
version = "0.1.0"
description = "Tarea 1 de Aprendizaje Automatico: prediccion de resultados del futbol uruguayo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn==1.9.*",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.2,<5",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
aa-clean-data = "aa_futbol.data:main"
aa-run-experiments = "aa_futbol.experiments:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aa_futbol"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["notebook", "notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
